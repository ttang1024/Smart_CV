trigger:
  - main

variables:
  azureSubscription: 'YOUR_AZURE_SERVICE_CONNECTION'
  appName: 'smart-cv-app'
  resourceGroup: 'smart-cv-rg'
  location: 'eastus'
  imageTag: '$(Build.BuildId)'
  dockerPlatform: 'linux/amd64'

stages:
  - stage: Deploy
    displayName: Build and Deploy Container App
    jobs:
      - job: DeployJob
        displayName: Build image and deploy
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          - task: AzureCLI@2
            displayName: 'Build image and deploy Container App'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail

                ACR_NAME=$(echo "$(appName)acr" | tr -d '-')

                az group create \
                  --name "$(resourceGroup)" \
                  --location "$(location)" \
                  --output none

                if ! az acr show --name "$ACR_NAME" --resource-group "$(resourceGroup)" --output none 2>/dev/null; then
                  az acr create \
                    --name "$ACR_NAME" \
                    --resource-group "$(resourceGroup)" \
                    --location "$(location)" \
                    --sku Basic \
                    --admin-enabled true \
                    --output none
                fi

                ACR_LOGIN_SERVER=$(az acr show \
                  --name "$ACR_NAME" \
                  --resource-group "$(resourceGroup)" \
                  --query loginServer -o tsv)

                IMAGE="${ACR_LOGIN_SERVER}/$(appName):$(imageTag)"

                az acr login --name "$ACR_NAME"

                docker build \
                  --platform "$(dockerPlatform)" \
                  --tag "$IMAGE" \
                  .

                docker push "$IMAGE"

                az deployment group create \
                  --resource-group "$(resourceGroup)" \
                  --template-file azure/main.bicep \
                  --parameters location="$(location)" appName="$(appName)" imageTag="$(imageTag)"

                APP_FQDN=$(az containerapp show \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --query properties.configuration.ingress.fqdn -o tsv)

                echo "Container App URL: https://${APP_FQDN}"
